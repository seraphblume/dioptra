name: Verify frozen v0.2 contract

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify v0.2 freeze contract
        run: node tests/v0.2-freeze.test.js

      - name: Parse proposed v0.3 schema
        run: node -e 'JSON.parse(require("fs").readFileSync("docs/data-collection-v0.3.schema.json", "utf8"))'
