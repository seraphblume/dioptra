name: Verify engines

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: for f in js/*.js tools/*.js tests/*.js sw.js; do node --check "$f"; done

      - name: Verify v0.2 freeze contract
        run: node tests/v0.2-freeze.test.js

      - name: Verify v0.3 engine and scoring
        run: node tests/v0.3-engine.test.js

      - name: Verify v0.4 RC, agreement scoring and v0.3 baseline parity
        run: node tests/v0.4-rc.test.js

      - name: Verify autorefractor ticket parser
        run: node tests/ticket-scan.test.js

      - name: Verify exports and offset fitting
        run: node tests/export-and-fit.test.js

      - name: Verify optical calculators
        run: node tests/optical-calculators.test.js

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Verify candidate form and data flow
        run: node tests/app-flow.browser.js
        env:
          DIOPTRA_SCREENSHOT_DIR: ${{ runner.temp }}/dioptra-ui

      - name: Save browser preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-browser-preview
          path: ${{ runner.temp }}/dioptra-ui
          if-no-files-found: ignore

      - name: Parse proposed v0.3 schema
        run: node -e 'JSON.parse(require("fs").readFileSync("docs/data-collection-v0.3.schema.json", "utf8"))'
